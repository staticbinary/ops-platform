apiVersion: apps/v1
kind: Deployment

metadata:
  name: asset-service
  namespace: ops-platform
  labels:
    app: asset-service

spec:
  replicas: 1

  selector:
    matchLabels:
      app: asset-service

  template:
    metadata:
      labels:
        app: asset-service

    spec:
      containers:
        - name: asset-service
          image: visualbinary/ops-platform-asset-service:local
          imagePullPolicy: IfNotPresent

          ports:
            - name: http
              containerPort: 8000

          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi    

          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: ops-platform-secret
                  key: DATABASE_URL

            - name: ENVIRONMENT
              valueFrom:
                configMapKeyRef:
                  name: ops-platform-config
                  key: ENVIRONMENT

            - name: JWT_ALGORITHM
              valueFrom:
                configMapKeyRef:
                  name: ops-platform-config
                  key: JWT_ALGORITHM

            - name: JWT_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: ops-platform-secret
                  key: JWT_SECRET_KEY

            - name: SERVICE_NAME
              value: asset-service

          startupProbe:
            httpGet:
              path: /health/startup
              port: 8000
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 12

          readinessProbe:
            httpGet:
              path: /health/ready
              port: 8000
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3

          livenessProbe:
            httpGet:
              path: /health/live
              port: 8000
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
