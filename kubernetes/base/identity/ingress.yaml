apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: keycloak-strip-prefix
  namespace: ops-platform
spec:
  stripPrefix:
    prefixes:
      - /keycloak
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: keycloak-ingress
  namespace: ops-platform
  annotations:
    traefik.ingress.kubernetes.io/router.middlewares: ops-platform-keycloak-strip-prefix@kubernetescrd
spec:
  ingressClassName: traefik
  rules:
    - http:
        paths:
          - path: /keycloak
            pathType: Prefix
            backend:
              service:
                name: keycloak
                port:
                  number: 8080