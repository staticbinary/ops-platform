apiVersion: apps/v1
kind: Deployment

metadata:
  name: tempo
  namespace: ops-platform
  labels:
    app: tempo

spec:
  replicas: 1

  selector:
    matchLabels:
      app: tempo

  template:
    metadata:
      labels:
        app: tempo

    spec:
      containers:
        - name: tempo
          image: grafana/tempo:2.10.5
          imagePullPolicy: IfNotPresent

          args:
            - -config.file=/etc/tempo/tempo.yml

          ports:
            - name: http
              containerPort: 3200

            - name: otlp-grpc
              containerPort: 4317

            - name: otlp-http
              containerPort: 4318

          volumeMounts:
            - name: tempo-config
              mountPath: /etc/tempo/tempo.yml
              subPath: tempo.yml
              readOnly: true

          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi

          readinessProbe:
            httpGet:
              path: /ready
              port: 3200
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3

          livenessProbe:
            httpGet:
              path: /ready
              port: 3200
            initialDelaySeconds: 15
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3

      volumes:
        - name: tempo-config
          configMap:
            name: tempo-config