apiVersion: apps/v1
kind: Deployment
metadata:
  name: alertmanager
  namespace: ops-platform
  labels:
    app: alertmanager
    component: observability
spec:
  replicas: 1

  strategy:
    type: Recreate

  selector:
    matchLabels:
      app: alertmanager

  template:
    metadata:
      labels:
        app: alertmanager
        component: observability

    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        fsGroup: 65534
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault

      containers:
        - name: alertmanager
          image: quay.io/prometheus/alertmanager:v0.32.1
          imagePullPolicy: IfNotPresent

          args:
            - --config.file=/etc/alertmanager/alertmanager.yml
            - --storage.path=/alertmanager
            - --web.listen-address=:9093

          ports:
            - name: http
              containerPort: 9093
              protocol: TCP

          startupProbe:
            httpGet:
              path: /-/ready
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 30

          readinessProbe:
            httpGet:
              path: /-/ready
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3

          livenessProbe:
            httpGet:
              path: /-/healthy
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3

          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 300m
              memory: 256Mi

          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL

          volumeMounts:
            - name: alertmanager-config
              mountPath: /etc/alertmanager/alertmanager.yml
              subPath: alertmanager.yml
              readOnly: true

            - name: alertmanager-data
              mountPath: /alertmanager

            - name: tmp
              mountPath: /tmp

            - name: alertmanager-secret
              mountPath: /etc/alertmanager/secrets
              readOnly: true

      volumes:
        - name: alertmanager-config
          configMap:
            name: alertmanager-config

        - name: alertmanager-secret
          secret:
            secretName: alertmanager-secret

        - name: alertmanager-data
          persistentVolumeClaim:
            claimName: alertmanager-data

        - name: tmp
          emptyDir: {}
