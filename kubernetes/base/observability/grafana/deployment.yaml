apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: ops-platform
  labels:
    app: grafana
    component: observability
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: grafana
  template:
    metadata:
      labels:
        app: grafana
        component: observability
    spec:
      securityContext:
        fsGroup: 472
        fsGroupChangePolicy: OnRootMismatch

      containers:
        - name: grafana
          image: grafana/grafana:13.1.1
          imagePullPolicy: IfNotPresent

          ports:
            - name: http
              containerPort: 3000
              protocol: TCP

          env:
            - name: GF_SMTP_ENABLED
              value: "true"

            - name: GF_SMTP_HOST
              value: "smtp.gmail.com:587"

            - name: GF_SMTP_FROM_ADDRESS
              value: "staticbinaryops@gmail.com"

            - name: GF_SMTP_FROM_NAME
              value: "Ops Platform Grafana"

            - name: GF_SMTP_SKIP_VERIFY
              value: "false"

            - name: GF_SMTP_STARTTLS_POLICY
              value: "MandatoryStartTLS"

            - name: GF_SMTP_USER
              valueFrom:
                secretKeyRef:
                  name: grafana-secret
                  key: GF_SMTP_USER

            - name: GF_SMTP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: grafana-secret
                  key: GF_SMTP_PASSWORD

            - name: GF_SERVER_ROOT_URL
              value: "http://localhost/grafana/"

            - name: GF_SERVER_SERVE_FROM_SUB_PATH
              value: "true"

          startupProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 30

          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3

          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3

          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi

          volumeMounts:
            - name: grafana-data
              mountPath: /var/lib/grafana

            - name: grafana-dashboards
              mountPath: /var/lib/grafana/dashboards
              readOnly: true

            - name: grafana-provisioning
              mountPath: /etc/grafana/provisioning/datasources/datasources.yml
              subPath: datasources.yml
              readOnly: true

            - name: grafana-provisioning
              mountPath: /etc/grafana/provisioning/dashboards/dashboards.yml
              subPath: dashboards.yml
              readOnly: true

            - name: grafana-provisioning
              mountPath: /etc/grafana/provisioning/alerting/contact-points.yml
              subPath: contact-points.yml
              readOnly: true

            - name: grafana-provisioning
              mountPath: /etc/grafana/provisioning/alerting/notification-policies.yml
              subPath: notification-policies.yml
              readOnly: true

            - name: grafana-provisioning
              mountPath: /etc/grafana/provisioning/alerting/templates.yml
              subPath: templates.yml
              readOnly: true

      volumes:
        - name: grafana-data
          persistentVolumeClaim:
            claimName: grafana-data

        - name: grafana-dashboards
          configMap:
            name: grafana-dashboards

        - name: grafana-provisioning
          configMap:
            name: grafana-provisioning
