apiVersion: v1
kind: ConfigMap
metadata:
  name: alloy-config
  namespace: ops-platform
  labels:
    app: alloy
    component: observability
data:
  config.alloy: |
    logging {
      level  = "info"
      format = "logfmt"
    }

    discovery.kubernetes "ops_platform_pods" {
      role = "pod"

      namespaces {
        names = ["ops-platform"]
      }
    }

    discovery.relabel "ops_platform_pod_logs" {
      targets = discovery.kubernetes.ops_platform_pods.targets

      rule {
        source_labels = ["__meta_kubernetes_namespace"]
        target_label  = "namespace"
      }

      rule {
        source_labels = ["__meta_kubernetes_pod_name"]
        target_label  = "pod"
      }

      rule {
        source_labels = ["__meta_kubernetes_pod_container_name"]
        target_label  = "container"
      }

      rule {
        source_labels = ["__meta_kubernetes_pod_label_app"]
        target_label  = "app"
      }

      rule {
        source_labels = ["__meta_kubernetes_pod_label_app"]
        target_label  = "service_name"
      }

      rule {
        source_labels = [
          "__meta_kubernetes_namespace",
          "__meta_kubernetes_pod_container_name",
        ]
        separator    = "/"
        target_label = "job"
      }
    }

    loki.source.kubernetes "ops_platform_pods" {
      targets    = discovery.relabel.ops_platform_pod_logs.output
      forward_to = [loki.write.local.receiver]
    }

    loki.write "local" {
      endpoint {
        url = "http://loki:3100/loki/api/v1/push"
      }
    }
