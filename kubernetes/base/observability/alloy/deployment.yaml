apiVersion: apps/v1
kind: Deployment
metadata:
  name: alloy
  namespace: ops-platform
  labels:
    app: alloy
    component: observability
spec:
  replicas: 1

  selector:
    matchLabels:
      app: alloy

  template:
    metadata:
      labels:
        app: alloy
        component: observability

    spec:
      serviceAccountName: alloy

      securityContext:
        runAsNonRoot: true
        runAsUser: 473
        runAsGroup: 473
        fsGroup: 473
        seccompProfile:
          type: RuntimeDefault

      containers:
        - name: alloy
          image: grafana/alloy:v1.18.0
          imagePullPolicy: IfNotPresent

          args:
            - run
            - --server.http.listen-addr=0.0.0.0:12345
            - --storage.path=/var/lib/alloy/data
            - --disable-reporting
            - /etc/alloy/config.alloy

          ports:
            - name: http
              containerPort: 12345
              protocol: TCP

          startupProbe:
            httpGet:
              path: /-/ready
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 30

          readinessProbe:
            httpGet:
              path: /-/ready
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3

          livenessProbe:
            httpGet:
              path: /-/healthy
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3

          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 300m
              memory: 256Mi

          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL

          volumeMounts:
            - name: alloy-config
              mountPath: /etc/alloy/config.alloy
              subPath: config.alloy
              readOnly: true

            - name: alloy-data
              mountPath: /var/lib/alloy/data

            - name: tmp
              mountPath: /tmp

      volumes:
        - name: alloy-config
          configMap:
            name: alloy-config

        - name: alloy-data
          emptyDir: {}

        - name: tmp
          emptyDir: {}
