services:
  reverse-proxy:
    image: nginx:alpine
    container_name: ops-reverse-proxy
    ports:
      - "${REVERSE_PROXY_PORT}:80"
    volumes:
      - ./infrastructure/reverse-proxy/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      asset_service:
        condition: service_healthy
      auth_service:
        condition: service_healthy
    networks:
      - ops-platform-network

  asset_service:
    build:
      context: ./services/asset_service
    container_name: ops-asset-service
    ports:
      - "8001:8000"
    environment:
      SERVICE_NAME: ${ASSET_SERVICE_NAME}
      ENVIRONMENT: ${ASSET_SERVICE_ENVIRONMENT}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      JWT_ALGORITHM: ${JWT_ALGORITHM}
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready').read()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - ops-platform-network

  auth_service:
    build:
      context: ./services/auth_service
    container_name: ops-auth-service
    ports:
      - "8002:8000"
    environment:
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      JWT_ALGORITHM: ${JWT_ALGORITHM}
    volumes:
      - auth-data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health').read()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - ops-platform-network

  postgres:
    image: postgres:17-alpine
    container_name: ops-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - ops-platform-network

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:latest
    container_name: ops-postgres-exporter
    ports:
      - "9187:9187"
    environment:
      DATA_SOURCE_NAME: "postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--spider",
          "-q",
          "http://localhost:9187/metrics"
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: unless-stopped
    networks:
      - ops-platform-network

  prometheus:
    image: prom/prometheus:latest
    container_name: ops-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./infrastructure/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./infrastructure/monitoring/prometheus-alerts.yml:/etc/prometheus/prometheus-alerts.yml:ro
    depends_on:
      asset_service:
        condition: service_healthy
    networks:
      - ops-platform-network

  grafana:
    image: grafana/grafana:latest
    container_name: ops-grafana
    ports:
      - "3000:3000"
    depends_on:
      prometheus:
        condition: service_started
      loki:
        condition: service_started
      tempo:
        condition: service_started
    networks:
      - ops-platform-network
    volumes:
      - grafana-data:/var/lib/grafana
      - ./infrastructure/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infrastructure/grafana/dashboards:/var/lib/grafana/dashboards:ro
    environment:
      GF_SMTP_ENABLED: ${GF_SMTP_ENABLED}
      GF_SMTP_HOST: ${GF_SMTP_HOST}
      GF_SMTP_USER: ${GF_SMTP_USER}
      GF_SMTP_PASSWORD: ${GF_SMTP_PASSWORD}
      GF_SMTP_FROM_ADDRESS: ${GF_SMTP_FROM_ADDRESS}
      GF_SMTP_FROM_NAME: ${GF_SMTP_FROM_NAME}
      GF_SMTP_SKIP_VERIFY: ${GF_SMTP_SKIP_VERIFY}
      GF_SMTP_STARTTLS_POLICY: ${GF_SMTP_STARTTLS_POLICY}

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: ops-cadvisor
    ports:
      - "8080:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    networks:
      - ops-platform-network
    restart: "unless-stopped"

  node-exporter:
    image: prom/node-exporter:latest
    container_name: ops-node-exporter
    ports:
      - "9100:9100"
    command:
      - "--path.rootfs=/host"
    volumes:
      - /:/host:ro
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--spider",
          "-q",
          "http://localhost:9100/metrics"
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: unless-stopped
    networks:
      - ops-platform-network

  blackbox-exporter:
    image: prom/blackbox-exporter:latest
    container_name: ops-blackbox-exporter
    ports:
      - "9115:9115"
    volumes:
      - ./infrastructure/monitoring/blackbox/blackbox.yml:/etc/blackbox_exporter/config.yml:ro
    command:
      - "--config.file=/etc/blackbox_exporter/config.yml"
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--spider",
          "-q",
          "http://localhost:9115/metrics"
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: unless-stopped
    networks:
      - ops-platform-network

  loki:
    image: grafana/loki:latest
    container_name: ops-loki
    ports:
      - "3100:3100"
    command: -config.file=/etc/loki/local-config.yaml
    networks:
      - ops-platform-network
    restart: "unless-stopped"

  promtail:
    image: grafana/promtail:latest
    container_name: ops-promtail
    volumes:
      - ./infrastructure/monitoring/promtail/promtail-config.yml:/etc/promtail/config.yml:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    command: -config.file=/etc/promtail/config.yml
    networks:
      - ops-platform-network
    restart: "unless-stopped"

  tempo:
    image: grafana/tempo:latest
    container_name: ops-tempo
    ports:
      - "3200:3200"
      - "4317:4317"
      - "4318:4318"
    command: -config.file=/etc/tempo/tempo.yml
    volumes:
      - ./infrastructure/monitoring/tempo.yml:/etc/tempo/tempo.yml:ro
    networks:
      - ops-platform-network
    restart: "unless-stopped"

networks:
  ops-platform-network:
    driver: bridge

volumes:
  postgres-data:
  auth-data:
  grafana-data: