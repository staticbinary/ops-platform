services:
  reverse-proxy:
    image: nginx:alpine
    container_name: ops-reverse-proxy
    ports:
      - "8080:80"
    volumes:
      - ./infrastructure/reverse-proxy/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - asset-service
    networks:
      - ops-platform-network

  asset-service:
    build:
      context: ./services/asset_service
    container_name: ops-asset-service
    networks:
      - ops-platform-network

networks:
  ops-platform-network:
    driver: bridge
