services:
  reverse-proxy:
    image: nginx:alpine
    container_name: ops-reverse-proxy
    ports:
      - "${REVERSE_PROXY_PORT}:80"
    volumes:
      - ./infrastructure/reverse-proxy/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - asset-service
    networks:
      - ops-platform-network

  asset-service:
    build:
      context: ./services/asset_service
    container_name: ops-asset-service
    expose:
      - "8000"
    networks:
      - ops-platform-network

  postgres:
    image: postgres:17-alpine
    container_name: ops-postgres
    environment:
      POSTGRES_DB: ops_platform
      POSTGRES_USER: ops_user
      POSTGRES_PASSWORD: ops_password
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - ops-platform-network

networks:
  ops-platform-network:
    driver: bridge

volumes:
  postgres-data:
