services:
  reverse-proxy:
    image: nginx:alpine
    container_name: ops-reverse-proxy
    ports:
      - "${REVERSE_PROXY_PORT}:80"
    volumes:
      - ./infrastructure/reverse-proxy/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - asset_service
      - auth_service
    networks:
      - ops-platform-network

  asset_service:
    build:
      context: ./services/asset_service

    container_name: ops-asset-service

    ports:
      - "8001:8000"

    environment:
      SERVICE_NAME: ${ASSET_SERVICE_NAME}
      ENVIRONMENT: ${ASSET_SERVICE_ENVIRONMENT}
      SECRET_KEY: ${ASSET_SERVICE_SECRET_KEY}
      JWT_ALGORITHM: ${ASSET_SERVICE_JWT_ALGORITHM}
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}

    depends_on:
      - postgres

    networks:
      - ops-platform-network

  auth_service:
    build:
      context: ./services/auth_service
    container_name: ops-auth-service
    ports:
      - "8002:8000"
    volumes:
      - auth-data:/app/data
    networks:
      - ops-platform-network

  postgres:
    image: postgres:17-alpine
    container_name: ops-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - ops-platform-network

networks:
  ops-platform-network:
    driver: bridge

volumes:
  postgres-data:
  auth-data: