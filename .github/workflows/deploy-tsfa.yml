name: Deploy TSFA Developer Portal

on:
  push:
    branches:
      - main
    paths:
      - "docs/07-TSFA/**"
      - ".github/workflows/deploy-tsfa.yml"

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: tsfa-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Prepare TSFA site
        run: |
          mkdir -p _site
          cp -R docs/07-TSFA/docs _site/docs
          cp -R docs/07-TSFA/openapi _site/openapi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
