name: Ops Platform CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Validate Docker Compose Configuration
        run: |
          docker compose config

      - name: Validate Shell Scripts
        run: |
          find scripts -type f -name "*.sh" -exec bash -n {} \;

      - name: Validate Repository Structure
        run: |
          test -f docker-compose.yml
          test -d services
          test -d scripts
          test -d infrastructure
          test -d docs

      - name: Start Platform Runtime
        run: |
          docker compose up -d --build

      - name: Show Container Status
        run: |
          docker compose ps

      - name: Validate Asset Service Health
        run: |
          curl --fail http://localhost:8001/health

      - name: Validate Auth Service Health
        run: |
          curl --fail http://localhost:8002/health

      - name: Show Logs on Failure
        if: failure()
        run: |
          docker compose logs --tail=100

      - name: Stop Platform Runtime
        if: always()
        run: |
          docker compose down -v

      - name: CI Validation Complete
        run: |
          echo "Repository and runtime validation successful"