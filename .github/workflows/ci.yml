name: Ops Platform CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Create CI Environment File
        run: |
          cat > .env <<'EOF'
          POSTGRES_USER=ops_user
          POSTGRES_PASSWORD=ops_password
          POSTGRES_DB=ops_platform

          REVERSE_PROXY_PORT=8000

          ASSET_SERVICE_NAME=asset-service
          ASSET_SERVICE_ENVIRONMENT=development
          ASSET_SERVICE_SECRET_KEY=ci-asset-secret-key
          ASSET_SERVICE_JWT_ALGORITHM=HS256

          AUTH_SERVICE_SECRET_KEY=ci-auth-secret-key
          EOF

      - name: Validate Docker Compose Configuration
        run: |
          docker compose config

      - name: Validate Shell Scripts
        run: |
          find scripts -type f -name "*.sh" -exec bash -n {} \;

      - name: Validate Repository Structure
        run: |
          test -f docker-compose.yml
          test -d services
          test -d infrastructure
          test -d infrastructure/grafana
          test -d infrastructure/grafana/dashboards
          test -d infrastructure/grafana/provisioning
          test -d infrastructure/monitoring
          test -f infrastructure/monitoring/prometheus.yml
          test -f infrastructure/monitoring/prometheus-alerts.yml
          test -f infrastructure/monitoring/blackbox/blackbox.yml

      - name: Validate Grafana Dashboard JSON
        run: |
          find infrastructure/grafana/dashboards -type f -name "*.json" -exec python -m json.tool {} >/dev/null \;

      - name: Validate Grafana Provisioning
        run: |
          bash scripts/validate-grafana-provisioning.sh

      - name: Validate Prometheus Alert Rules
        run: |
          docker run --rm \
            --entrypoint promtool \
            -v "$PWD/infrastructure/monitoring:/etc/prometheus:ro" \
            prom/prometheus:latest \
            check rules /etc/prometheus/prometheus-alerts.yml

      - name: Start Platform
        run: |
          docker compose up -d --build

      - name: Wait For Services
        run: |
          sleep 45

      - name: Show Container Status
        run: |
          docker compose ps

      - name: Validate Service Health
        run: |
          docker compose ps

          curl --fail http://localhost:8000/api/assets/health
          curl --fail http://localhost:8000/api/assets/health/ready
          curl --fail http://localhost:8002/health
          curl --fail http://localhost:9090/-/ready
          curl --fail http://localhost:3000/api/health
          curl --fail http://localhost:9100/metrics
          curl --fail http://localhost:9187/metrics
          curl --fail http://localhost:9115/metrics

      - name: Validate Prometheus Targets
        run: |
          curl --fail "http://localhost:9090/api/v1/query?query=up"

      - name: Validate Blackbox Metrics
        run: |
          curl --fail "http://localhost:9090/api/v1/query?query=probe_success"
          curl --fail "http://localhost:9090/api/v1/query?query=probe_http_status_code"

      # --------------------------------------------------
      # Failure Diagnostics
      # --------------------------------------------------

      - name: Print Docker Compose Logs On Failure
        if: failure()
        run: |
          docker compose ps
          docker compose logs postgres
          docker compose logs postgres-exporter
          docker compose logs node-exporter
          docker compose logs blackbox-exporter
          docker compose logs prometheus
          docker compose logs grafana
          docker compose logs asset_service
          docker compose logs auth_service